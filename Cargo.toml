[package]
name = "fourier"
version = "0.1.0"
edition = "2024"

[features]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25.0", default-features = false }
rfd = { version = "0.15.4", optional = true }
serde_json = "1"
tiny_http = "0.12"
